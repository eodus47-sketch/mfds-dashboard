name: Daily MFDS Data Sync

on:
  schedule:
    # 한국 시간 기준 매일 오전 6시 (UTC 기준 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # 버튼 클릭으로 수동 실행할 수 있게 해주는 옵션

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬(Python) 환경 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: API 통신용 라이브러리 설치
        run: pip install requests

      - name: 식약처 데이터 수집 실행
        run: python fetch_data.py

      - name: 변경된 데이터 저장소에 업데이트(Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update MFDS data" && git push)
